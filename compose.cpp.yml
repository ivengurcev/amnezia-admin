services:
  amnezia-admin:
    build:
      context: .
      dockerfile: Dockerfile.cpp
      args:
        BUILD_TYPE: Debug

    environment:
      AWG_INTERFACE: awg0
      AWG_PORT: ${AWG_PORT}
      AWG_ENDPOINT_HOST: 127.0.0.1
      SETUP_BASE_URL: http://localhost:3001     
      ADMIN_DEV_MODE: "1" 

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      - "127.0.0.1:3001:3000"
      - "${AWG_PORT}:${AWG_PORT}/udp"
      - "3002:3002"

    volumes:
      - amnezia-cpp-data:/data
    init: true
    stop_grace_period: 3s

volumes:
  amnezia-cpp-data:
    external: true