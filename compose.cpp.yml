services:
  amnezia-admin:
    build:
      context: .
      dockerfile: Dockerfile.cpp
      args:
        BUILD_TYPE: Debug

    environment:
      AWG_INTERFACE: awg0

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      - "127.0.0.1:3001:3000"

    volumes:
      - amnezia-cpp-data:/data
    init: true
    stop_grace_period: 3s

volumes:
  amnezia-cpp-data:
    external: true