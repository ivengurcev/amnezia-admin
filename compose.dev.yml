services:
    amnezia-admin:
        build:
            context: .
            dockerfile: Dockerfile.dev

        container_name: amnezia-admin-dev

        environment:
            AWG_DRIVER: real
            AWG_INTERFACE: awg-test
            AWG_ADDRESS: 10.90.0.1/24
            AWG_PORT: 18443
            AWG_ENDPOINT_HOST: amnezia-admin
            AWG_CLIENT_ALLOWED_IPS: 10.90.0.0/24
            AWG_PERSISTENT_KEEPALIVE: 25

        cap_add:
            - NET_ADMIN

        devices:
            - /dev/net/tun:/dev/net/tun

        ports:
            - "3001:3000/tcp"
            - "18443:18443/udp"

        volumes:
            - ./packages/server:/app/packages/server
            - awg-data:/data

volumes:
    awg-data:
